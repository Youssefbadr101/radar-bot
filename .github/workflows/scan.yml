name: Radar Scan

on:
  schedule:
    # Runs every 6 hours. Edit the cron to change frequency.
    # Format: minute hour day month weekday (UTC time)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/scan.py

      - name: Commit updated findings
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add findings.json
          git diff --staged --quiet || git commit -m "radar: auto-scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
